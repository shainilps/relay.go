#(necessary)
app:
  network: MAIN # MAIN/TEST
  addr: :8080

#taal(necessary)
arc:
  token:

#whatsonchain(optional)
woc:
  token:

rabbitmq:
  # url: amqp://guest:guest@localhost:5672/ (for local)
  url: amqp://guest:guest@rabbitmq:5672/
  prefetch: 50

db:
  url: postgres://relay:relay@postgres:5432/relay?sslmode=disable

redis:
  url: redis://redis:6379/0

#default 1
fund_amount: 1
funding_scan_interval: 5m

sync:
  max_attempts: 5
  max_age: 24h
  rebroadcast_interval: 10m
  poll_interval: 10s
  batch_size: 50
